name: UX QA temporary

on:
  push:
    branches:
      - ux-mobile-v0.6.1

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node --test tests/engine.test.cjs
      - name: Install browser test dependency
        run: |
          npm init -y
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.cjs
