name: Validate Treguafulbo Plan Condor
on:
  push:
    branches: [plan-condor-treguafulbo]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          start=html.rfind("<script>")+len("<script>")
          end=html.rfind("</script>")
          assert start >= len("<script>") and end > start
          Path("/tmp/treguafulbo-app.js").write_text(html[start:end])
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/treguafulbo-app.js
      - name: Check identity/version markers
        run: |
          grep -q "TREGUAFULBO" index.html
          grep -q "const VERSION = '0.2.0'" index.html
          grep -q "treguafulbo-demo-v1" index.html
          grep -q "LEGACY_SAVE_KEY = 'trucebol-demo-v1'" index.html
          grep -q '"version": "0.2.0"' version.json
